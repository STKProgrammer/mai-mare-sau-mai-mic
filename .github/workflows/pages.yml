name: Publicare pe GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # GitHub Pages pune cache 10 minute: adaugam ?v=<commit> la JS/CSS/JSON,
      # ca dupa o publicare browserul sa nu amestece fisiere vechi cu cele noi
      - name: Versiune in link-uri (cache busting)
        run: python tools/cache_bust.py web "${GITHUB_SHA::8}"
      # site-ul e static: se publica direct folderul web/ (date deja generate de data/prepare.py)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
